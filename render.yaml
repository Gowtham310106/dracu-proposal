# Render blueprint for the Acu Heal API (free tier).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: acuheal-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @acuheal/types build && pnpm --filter @acuheal/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: STORAGE_DRIVER
        value: r2
      - key: WHATSAPP_PROVIDER
        value: console
      - key: STORAGE_INCLUDED_GB
        value: "30"
      - key: STORAGE_EXCESS_RATE_INR
        value: "50"
      - key: COOKIE_SECURE
        value: "true"
      # Set these in the Render dashboard (Environment tab) — never commit them.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: BIOMETRIC_API_KEY
        generateValue: true
      - key: JOBS_SECRET
        generateValue: true
